name: Update Latest YouTube Video

on:
  schedule:
    - cron: '0 */12 * * *' # Runs every 12 hours
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  update-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Latest Video

        run: |
          python -c "
          import requests
          import xml.etree.ElementTree as ET
          import json
          import re
          import os
          from datetime import datetime

          # Configuration
          # Channel ID provided by user
          CHANNEL_ID = 'UC6I5v921m_XS8HsVL8IChMQ'
          
          print(f'Using Channel ID: {CHANNEL_ID}')
          
          def fetch_stats(channel_handle):
               try:
                  url = f'https://www.youtube.com/{channel_handle}'
                  print(f'Fetching channel page for stats: {url}')
                  # User-Agent needed for scraping
                  headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36'}
                  r = requests.get(url, headers=headers)
                  r.raise_for_status()
                  
                  # Initial stats object
                  stats = {
                    'subscribers': 'N/A',
                    'videos': 'N/A',
                    'views': 'N/A'
                  }

                  # Try to find subscriber count in meta tags or specific JSON patterns
                  # Pattern 1: "subscriberCountText":{"accessibility":{"accessibilityData":{"label":"4.18K subscribers"}},"simpleText":"4.18K subscribers"}
                  sub_match = re.search(r'"subscriberCountText":\{.*?"simpleText":"(.*?)"\}', r.text)
                  if sub_match:
                      stats['subscribers'] = sub_match.group(1).split(' ')[0] # "4.18K"
                  
                  # Pattern 2: "videosCountText":{"accessibility":{"accessibilityData":{"label":"54 videos"}},"simpleText":"54 videos"}
                  vid_match = re.search(r'"videosCountText":\{.*?"simpleText":"(.*?)"\}', r.text)
                  if vid_match:
                      stats['videos'] = vid_match.group(1).split(' ')[0] # "54"
                  
                  # Pattern 3: View count usually on About page, simpler to skip or just rely on sub count for now
                  # A lot of times scraping views requires loading the about tab which is a different URL.
                  
                  print(f"Scraped stats: {stats}")
                  return stats
               except Exception as e:
                  print(f"Error scraping stats: {e}")
                  return None

          # 1. Fetch Stats
          # Use handle from user
          channel_handle = '@asadullah-dal'
          stats = fetch_stats(channel_handle)
          if not stats: 
              stats = {'subscribers': '4K+', 'videos': '50+', 'views': '100K+'} # Fallback

          # 2. Fetch RSS Feed
          rss_url = f'https://www.youtube.com/feeds/videos.xml?channel_id={CHANNEL_ID}'
          print(f'Fetching RSS: {rss_url}')
          try:
              response = requests.get(rss_url)
              response.raise_for_status()
          except Exception as e:
              print(f'::error::Failed to fetch RSS feed: {e}')
              # If RSS fails but we have previous data, we might want to keep it, but here we exit
              exit(1)

          # 3. Parse XML
          try:
              root = ET.fromstring(response.content)
              ns = '{http://www.w3.org/2005/Atom}'
              media_ns = '{http://search.yahoo.com/mrss/}'
              yt_ns = '{http://www.youtube.com/xml/schemas/2015}'

              entries = root.findall(f'{ns}entry')
              if not entries:
                  print('No videos found in RSS feed.')
                  exit(0)

              videos = []
              # Get top 6 videos
              for entry in entries[:6]:
                  video_id = entry.find(f'{yt_ns}videoId').text
                  title = entry.find(f'{ns}title').text
                  published = entry.find(f'{ns}published').text
                  
                  media_group = entry.find(f'{media_ns}group')
                  thumbnail = media_group.find(f'{media_ns}thumbnail').attrib['url']
                  
                  hq_thumbnail = f'https://i.ytimg.com/vi/{video_id}/maxresdefault.jpg'
                  
                  # Verify HQ thumbnail (fast check)
                  try:
                      r_thumb = requests.head(hq_thumbnail, timeout=2)
                      final_thumbnail = hq_thumbnail if r_thumb.status_code == 200 else thumbnail
                  except:
                      final_thumbnail = thumbnail

                  videos.append({
                      'videoId': video_id,
                      'title': title,
                      'published': published,
                      'thumbnail': final_thumbnail
                  })
              
              print(f'Found {len(videos)} videos.')

              # Combine Data
              final_data = {
                  'stats': stats,
                  'videos': videos,
                  'lastUpdated': datetime.now().isoformat()
              }

              # 4. Save JSON
              os.makedirs('data', exist_ok=True)
              with open('data/recent-videos.json', 'w') as f:
                  json.dump(final_data, f, indent=2)
                  
          except Exception as e:
              print(f'::error::Failed to parse XML or extract data: {e}')
              exit(1)
          "

      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add data/latest-video.json
          git commit -m "Update latest video" || exit 0
          git push
